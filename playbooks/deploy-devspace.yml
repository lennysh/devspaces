---
# Playbook: Deploy Development Space for User
#
# This playbook configures a development environment (devspace) for a specific user
# using code-server. It assumes code-server is already installed.
#
# Usage:
#   ansible-playbook -i inventory playbooks/deploy-devspace.yml -e "username=alice" -e "code_server_pass=securepass123"
#
#   With specific port:
#   ansible-playbook -i inventory playbooks/deploy-devspace.yml \
#     -e "username=alice" \
#     -e "code_server_pass=securepass123" \
#     -e "dev_server_port=8080"
#
#   With custom port range:
#   ansible-playbook -i inventory playbooks/deploy-devspace.yml \
#     -e "username=alice" \
#     -e "code_server_pass=securepass123" \
#     -e "port_range_start=9000" \
#     -e "port_range_end=9099"
#
#   Using vault for password:
#   ansible-playbook -i inventory playbooks/deploy-devspace.yml \
#     -e "username=alice" \
#     -e "code_server_pass={{ vault_code_server_pass }}" \
#     --ask-vault-pass

- name: Deploy Development Space
  hosts: all
  become: true
  vars:
    # REQUIRED: Username to configure devspace for
    username:

    # OPTIONAL: Password for code-server authentication
    # If not set, authentication will be disabled
    code_server_pass:

    # OPTIONAL: Specific port for code-server
    # If null, automatically assigns next available port
    dev_server_port:

    # OPTIONAL: Port range for automatic port assignment
    port_range_start: 8080
    port_range_end: 8099

    # OPTIONAL: Deployment options
    deploy_inventory: false
    deploy_example_repo: false
    deploy_ansiblegalaxy_repo: false

    # OPTIONAL: SSL certificate configuration
    # cert_name: null
    # key_name: null
    # certandkeysourcefolder: null
    # certandkeydestfolder: null

    # OPTIONAL: Podman/Container configuration
    # additionalimagestores: null
    ansible_image: registry.redhat.io/ansible-automation-platform-26/ee-supported-rhel9:latest
    # registry_user: null
    # registry_pass: null

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.fail:
        msg: "username must be specified. Use -e 'username=youruser'"
      when: username is not defined or username is none

    - name: Check if code-server is installed
      ansible.builtin.command: which code-server
      register: code_server_check
      changed_when: false
      failed_when: false

    - name: Fail if code-server is not installed
      ansible.builtin.fail:
        msg: |
          code-server is not installed on this host.
          Please run install-code-server.yml first:
          ansible-playbook -i inventory playbooks/install-code-server.yml
      when: code_server_check.rc != 0

  roles:
    - role: lennysh.devspaces.devspace
      # vars:
      #   username: "{{ username }}"
      #   code_server_pass: "{{ code_server_pass }}"
      #   custom_dev_server_port: "{{ custom_dev_server_port }}"
      #   port_range_start: "{{ port_range_start }}"
      #   port_range_end: "{{ port_range_end }}"
      #   deploy_inventory: "{{ deploy_inventory }}"
      #   deploy_example_repo: "{{ deploy_example_repo }}"
      #   deploy_ansiblegalaxy_repo: "{{ deploy_ansiblegalaxy_repo }}"

  post_tasks:
    - name: Get inventory hostname
      ansible.builtin.set_fact:
        devspace_hostname: "{{ inventory_hostname }}"

    - name: Display devspace access information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Devspace deployment completed successfully!"
          - "=========================================="
          - "User: {{ username }}"
          - "Access URL: https://{{ devspace_hostname }}:{{ dev_server_port }}/?folder=/home/{{ username }}/ansible"
          - "Port: {{ dev_server_port }}"
          - "=========================================="
          - "Note: If using a password, use: {{ code_server_pass | default('No password set - authentication disabled') }}"
          - "=========================================="
...
