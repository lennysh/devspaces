---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe] # Allow custom YAML tags for Ansible
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [--format=parsable, --strict]
        types: [yaml]
        exclude: |
          (?x)^(
            .*\.retry$|
            changelogs/.*\.yaml$|
            meta/runtime\.yml$
          )$

  # Ansible linting
  - repo: https://github.com/ansible/ansible-lint.git
    rev: v6.22.1
    hooks:
      - id: ansible-lint
        args: [--write]
        files:
          (^playbooks/.*\.ya?ml$|^roles/.*/tasks/.*\.ya?ml$|^roles/.*/handlers/.*\.ya?ml$|^roles/.*/meta/.*\.ya?ml$|^roles/.*/defaults/.*\.ya?ml$|^roles/.*/vars/.*\.ya?ml$)
        exclude: |
          (?x)^(
            changelogs/.*\.yaml$|
            meta/runtime\.yml$
          )$

  # Python linting (for plugin modules)
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3
        files: ^plugins/.*\.py$

  # Python import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]
        files: ^plugins/.*\.py$

  # Python syntax and style checks
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=160, --extend-ignore=E203, --extend-ignore=W503]
        files: ^plugins/.*\.py$
        additional_dependencies:
          - flake8-docstrings
          - flake8-import-order

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]
        files: \.md$

  # Shell script linting (if you have any shell scripts)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
...
