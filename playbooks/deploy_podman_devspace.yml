---
# Playbook: Deploy Podman Development Space for User
#
# This playbook configures a development environment (devspace) for a specific user
# using a Podman container with code-server. It uses systemd quadlets to manage
# the container as a user service, running both inside and outside the container
# as the specified user (no root required inside container).
#
# Usage:
#   ansible-playbook -i inventory playbooks/deploy_podman_devspace.yml -e "username=alice" -e "code_server_pass=securepass123"
#
#   With specific port:
#   ansible-playbook -i inventory playbooks/deploy_podman_devspace.yml \
#     -e "username=alice" \
#     -e "code_server_pass=securepass123" \
#     -e "dev_server_port=8080"
#
#   With custom port range:
#   ansible-playbook -i inventory playbooks/deploy_podman_devspace.yml \
#     -e "username=alice" \
#     -e "code_server_pass=securepass123" \
#     -e "port_range_start=9000" \
#     -e "port_range_end=9099"
#
#   Using vault for password:
#   ansible-playbook -i inventory playbooks/deploy_podman_devspace.yml \
#     -e "username=alice" \
#     -e "code_server_pass={{ vault_code_server_pass }}" \
#     --ask-vault-pass
#
#   With custom container image:
#   ansible-playbook -i inventory playbooks/deploy_podman_devspace.yml \
#     -e "username=alice" \
#     -e "code_server_pass=securepass123" \
#     -e "podman_devspace_image=quay.io/myorg/my-image:latest"

- name: Deploy Podman Development Space
  hosts: all
  become: true
  vars:
    # REQUIRED: Username to configure devspace for
    username:

    # OPTIONAL: Password for code-server authentication
    # If not set, authentication will be disabled
    code_server_pass:

    # OPTIONAL: Specific port for code-server
    # If null, automatically assigns next available port
    dev_server_port:

    # OPTIONAL: Port range for automatic port assignment
    port_range_start: 8080
    port_range_end: 8099

    # OPTIONAL: Container image to use
    podman_devspace_image: "quay.io/lshirley/ansible-dev-space:latest"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.fail:
        msg: "username must be specified. Use -e 'username=youruser'"
      when: username is not defined or username is none

    - name: Check if podman is installed
      ansible.builtin.command: which podman
      register: podman_check
      changed_when: false
      failed_when: false

    - name: Fail if podman is not installed
      ansible.builtin.fail:
        msg: |
          podman is not installed on this host.
          Please run install_podman.yml first:
          ansible-playbook -i inventory playbooks/install_podman.yml
      when: podman_check.rc != 0

  roles:
    - role: lennysh.devspaces.podman_devspace
      # The role already displays the devspace access information,
      # so no post_tasks are needed
...
